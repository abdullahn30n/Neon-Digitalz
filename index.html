  <style>

/* =========================================================================
   NEON DIGITAL: DESIGN SYSTEM  ("Cinematic Nordic")
   1 Tokens (light default + dark)   2 Base     3 Layout & type   4 Buttons
   5 Header, theme button, drawer    6 Hero     7 Ticker          8 Sections & cards
   9 Pricing tiers                  10 Steps & FAQ  11 Foldables  12 Inner pages
   13 Footer, modal, WhatsApp button 14 Motion & transitions      15 Reduced motion
   LIGHT is the default theme. The operating system setting is ignored.
   Breakpoints: 640px, 900px, 1100px (desktop navigation).
   ========================================================================= */

/* 1. TOKENS -------------------------------------------------------------- */
:root {
  --nd-bg: #FBF8F2;
  --nd-surface: #FFFFFF;
  --nd-muted: #F3EEE4;
  --nd-border: #E6DFD2;
  --nd-border-strong: #CDC4B3;
  --nd-text: #161A2E;
  --nd-text-soft: #4B5063;
  --nd-primary: #1E3A8A;
  --nd-primary-hover: #172B6B;
  --nd-on-primary: #FFFFFF;
  --nd-accent: #E11D48;
  --nd-accent-hover: #BE123C;
  --nd-on-accent: #FFFFFF;
  --nd-accent-text: #B5103A;
  --nd-teal: #0F766E;
  --nd-gold: #E9C46A;
  --nd-link: #1E3A8A;
  --nd-header-bg: #FFFFFF;
  --nd-focus: #1E3A8A;
  --nd-stage: #0A1030;
  --nd-footer-bg: #0B1330;

  --nd-font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --nd-text-sm: .9375rem;
  --nd-text-base: 1.0625rem;
  --nd-h1: clamp(2.3rem, 1.2rem + 4vw, 4rem);
  --nd-h2: clamp(1.7rem, 1.1rem + 2vw, 2.5rem);
  --nd-h3: 1.1875rem;

  --nd-1: .25rem; --nd-2: .5rem; --nd-3: .75rem; --nd-4: 1rem; --nd-5: 1.5rem; --nd-6: 2rem; --nd-7: 3rem; --nd-8: 4.5rem;
  --nd-section: clamp(3.5rem, 2rem + 5vw, 6.5rem);
  --nd-gutter: clamp(1.25rem, 4vw, 2.5rem);
  --nd-container: 1160px;
  --nd-container-narrow: 740px;

  --nd-radius-sm: 8px;
  --nd-radius: 12px;
  --nd-radius-lg: 20px;
  --nd-shadow: 0 1px 2px rgba(22, 26, 46, .05), 0 8px 24px -16px rgba(22, 26, 46, .2);
  --nd-shadow-pop: 0 18px 40px -18px rgba(30, 58, 138, .45);
  --nd-header-h: 72px;
  --nd-ease: cubic-bezier(.2, .7, .2, 1);

  /* kept for older pages */
  --nordic-bg: var(--nd-bg); --nordic-surface: var(--nd-surface); --nordic-surface-muted: var(--nd-muted); --nordic-surface-elevated: #EDE7DC;
  --nordic-primary: var(--nd-primary); --nordic-primary-hover: var(--nd-primary-hover); --nordic-accent: var(--nd-accent); --nordic-accent-hover: var(--nd-accent-hover);
  --nordic-teal: var(--nd-teal); --nordic-teal-light: #CCFBF1; --nordic-text: var(--nd-text); --nordic-text-muted: var(--nd-text-soft);
  --nordic-border: var(--nd-border); --nordic-border-strong: var(--nd-border-strong); --nordic-card-shadow: var(--nd-shadow);
  color-scheme: light;
}
[data-theme="dark"] {
  --nd-bg: #0E111B;
  --nd-surface: #171B28;
  --nd-muted: #1A1F2E;
  --nd-border: #2A3044;
  --nd-border-strong: #3E465F;
  --nd-text: #ECE8E0;
  --nd-text-soft: #AFB4C6;
  --nd-primary: #7694F2;
  --nd-primary-hover: #9CB1F6;
  --nd-on-primary: #0B1020;
  --nd-accent: #E11D48;
  --nd-accent-hover: #F43F5E;
  --nd-accent-text: #FB8195;
  --nd-teal: #2DD4BF;
  --nd-link: #9DB2F5;
  --nd-header-bg: #11141F;
  --nd-focus: #9DB2F5;
  --nd-stage: #070A1C;
  --nd-footer-bg: #080B1A;
  --nd-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .7);
  --nd-shadow-pop: 0 18px 40px -18px rgba(0, 0, 0, .8);
  --nordic-surface-elevated: #262B3B; --nordic-teal-light: #134E4A;
  color-scheme: dark;
}

/* 2. BASE ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--nd-header-h) + 16px); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: var(--nd-bg); }
body { margin: 0; background: var(--nd-bg); color: var(--nd-text); font-family: var(--nd-font); font-size: var(--nd-text-base); line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: clip; }
.nd-app h1, .nd-app h2, .nd-app h3, .nd-app h4, .nd-app p, .nd-app ul, .nd-app ol, .nd-app dl, .nd-app figure { margin: 0; padding: 0; }
.nd-app ul, .nd-app ol { list-style: none; }
.nd-app img, .nd-app svg { max-width: 100%; }
.nd-app button { font: inherit; color: inherit; }
.nd-app a { color: var(--nd-link); }
:focus-visible { outline: 3px solid var(--nd-focus); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--nd-primary); color: var(--nd-on-primary); }
.nd-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.nd-skip { position: absolute; left: 1rem; top: -4rem; z-index: 300; padding: .7rem 1rem; background: var(--nd-accent); color: var(--nd-on-accent); border-radius: var(--nd-radius-sm); font-weight: 700; text-decoration: none; }
.nd-skip:focus { top: 1rem; }
body.nd-locked { overflow: hidden; }

/* 3. LAYOUT AND TYPE ----------------------------------------------------- */
.nd-app { min-height: 100vh; display: flex; flex-direction: column; }
.nd-app main { flex: 1; }
.nd-container { width: min(100% - 2 * var(--nd-gutter), var(--nd-container)); margin-inline: auto; }
.nd-container--narrow { width: min(100% - 2 * var(--nd-gutter), var(--nd-container-narrow)); }
.nd-section { padding-block: var(--nd-section); position: relative; }
.nd-section--muted { background: var(--nd-muted); }
.nd-section__head { max-width: 42rem; margin-bottom: var(--nd-6); }
.nd-section__head p { margin-top: var(--nd-3); }
.nd-app h1, .nd-app h2, .nd-app h3 { color: var(--nd-text); font-weight: 800; letter-spacing: -.025em; line-height: 1.12; }
.nd-app h1 { font-size: var(--nd-h1); letter-spacing: -.035em; }
.nd-app .nd-hero h1 { max-width: 15ch; }
.nd-app h2 { font-size: var(--nd-h2); }
.nd-app h3 { font-size: var(--nd-h3); line-height: 1.3; letter-spacing: -.01em; }
.nd-app .nd-h2-sm { font-size: 1.5rem; }
.nd-lead { font-size: 1.1875rem; color: var(--nd-text-soft); max-width: 36rem; }
.nd-soft { color: var(--nd-text-soft); }
.nd-small { font-size: var(--nd-text-sm); }
.nd-eyebrow { display: inline-flex; align-items: center; gap: .6rem; margin-bottom: var(--nd-3); font-size: .8125rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--nd-accent-text); }
.nd-eyebrow::before { content: ""; width: 28px; height: 2px; border-radius: 2px; background: currentColor; }

/* 4. BUTTONS AND LINKS --------------------------------------------------- */
.nd-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 50px; padding: .7rem 1.5rem; border-radius: var(--nd-radius); border: 2px solid transparent; font-size: 1rem; font-weight: 700; line-height: 1.2; text-decoration: none; cursor: pointer; transition: transform .25s var(--nd-ease), box-shadow .25s, background-color .2s, border-color .2s, color .2s; }
.nd-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .32) 50%, transparent 70%); transform: translateX(-130%); transition: transform .7s var(--nd-ease); pointer-events: none; }
.nd-btn:hover::after { transform: translateX(130%); }
.nd-btn:hover { transform: translateY(-2px); }
.nd-btn:active { transform: translateY(0) scale(.98); }
.nd-btn--cta { background: var(--nd-accent); color: var(--nd-on-accent) !important; box-shadow: 0 10px 24px -12px rgba(225, 29, 72, .7); }
.nd-btn--cta:hover { background: var(--nd-accent-hover); box-shadow: 0 14px 28px -12px rgba(225, 29, 72, .8); }
.nd-btn--primary { background: var(--nd-primary); color: var(--nd-on-primary) !important; }
.nd-btn--primary:hover { background: var(--nd-primary-hover); box-shadow: var(--nd-shadow-pop); }
.nd-btn--ghost { background: transparent; border-color: var(--nd-border-strong); color: var(--nd-text) !important; }
.nd-btn--ghost:hover { border-color: var(--nd-primary); color: var(--nd-link) !important; }
.nd-btn--light { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .5); color: #FFFFFF !important; }
.nd-btn--light:hover { background: #FFFFFF; border-color: #FFFFFF; color: #172B6B !important; }
.nd-btn--sm { min-height: 42px; padding: .5rem 1.1rem; font-size: .95rem; }
.nd-btn--block { width: 100%; }
.nd-btn svg { flex: none; }
.nd-link { display: inline-flex; align-items: center; gap: .35rem; font-weight: 700; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; color: var(--nd-link); }
.nd-link svg { transition: transform .25s var(--nd-ease); }
.nd-link:hover { text-decoration: underline; text-underline-offset: .2em; }
.nd-link:hover svg { transform: translateX(4px); }
.nd-actions { display: flex; flex-wrap: wrap; gap: var(--nd-3); }
.nd-icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--nd-border-strong); border-radius: var(--nd-radius-sm); background: transparent; cursor: pointer; color: var(--nd-text); transition: transform .2s, background-color .2s; }
.nd-icon-btn:hover { background: var(--nd-muted); transform: rotate(90deg); }

/* 5. HEADER, THEME BUTTON, DRAWER ---------------------------------------- */
.nd-header { position: sticky; top: 0; z-index: 100; background: var(--nd-header-bg); color: var(--nd-text); border-bottom: 1px solid var(--nd-border); transition: box-shadow .3s, background-color .3s; }
.nd-header.is-scrolled { box-shadow: 0 10px 30px -18px rgba(22, 26, 46, .45); }
.nd-header__bar { display: flex; align-items: center; gap: var(--nd-3); min-height: var(--nd-header-h); }
.nd-brand { display: inline-flex; align-items: center; gap: .7rem; margin-right: auto; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; color: var(--nd-text) !important; flex: none; }
.nd-mark { display: block; flex: none; transition: transform .5s var(--nd-ease); filter: drop-shadow(0 6px 10px rgba(30, 58, 138, .3)); }
.nd-brand:hover .nd-mark { transform: rotate(-6deg) scale(1.06); }
.nd-brand__word { font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em; line-height: 1; color: inherit; }
.nd-brand__word span { display: block; margin-top: 4px; font-size: .72rem; font-weight: 800; letter-spacing: .34em; color: var(--nd-accent-text); }
.nd-nav { display: none; }
.nd-nav ul { display: flex; gap: .1rem; }
.nd-nav a, .nd-drawer a.nd-drawer__link { position: relative; display: block; padding: .55rem .8rem; border-radius: var(--nd-radius-sm); color: var(--nd-text-soft) !important; text-decoration: none; font-weight: 700; font-size: .95rem; transition: color .2s, background-color .2s; }
.nd-nav a::after { content: ""; position: absolute; left: .8rem; right: .8rem; bottom: .2rem; height: 2px; border-radius: 2px; background: var(--nd-accent); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--nd-ease); }
.nd-nav a:hover { color: var(--nd-text) !important; background: var(--nd-muted); }
.nd-nav a:hover::after, .nd-nav a[aria-current="page"]::after { transform: scaleX(1); }
.nd-nav a[aria-current="page"] { color: var(--nd-text) !important; }
.nd-header__cta { display: none; }
.nd-menu-btn { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: var(--nd-radius); background: transparent; border: 1px solid var(--nd-border-strong); color: var(--nd-text); cursor: pointer; }
.nd-burger { position: relative; width: 20px; height: 14px; display: block; }
.nd-burger i { position: absolute; left: 0; width: 100%; height: 2px; border-radius: 2px; background: currentColor; transition: transform .35s var(--nd-ease), opacity .2s, top .35s var(--nd-ease); }
.nd-burger i:nth-child(1) { top: 0; } .nd-burger i:nth-child(2) { top: 6px; } .nd-burger i:nth-child(3) { top: 12px; }
.nd-burger.is-open i:nth-child(1) { top: 6px; transform: rotate(45deg); }
.nd-burger.is-open i:nth-child(2) { opacity: 0; }
.nd-burger.is-open i:nth-child(3) { top: 6px; transform: rotate(-45deg); }

.nd-theme-btn { display: inline-flex; align-items: center; gap: .6rem; min-width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 999px; border: 1px solid var(--nd-border-strong); background: var(--nd-muted); color: var(--nd-text); cursor: pointer; transition: background-color .3s, border-color .3s, transform .2s; }
.nd-theme-btn:hover { border-color: var(--nd-primary); transform: translateY(-1px); }
.nd-theme-btn:active { transform: scale(.94); }
.nd-theme-btn__icons { position: relative; width: 22px; height: 22px; display: block; }
.nd-theme-btn__icons svg { position: absolute; inset: 0; width: 22px; height: 22px; transition: transform .55s var(--nd-ease), opacity .35s; }
.nd-theme-btn__sun { color: #D97706; }
.nd-theme-btn__moon { color: #A5B4FC; }
.nd-theme-btn__icons[data-mode="light"] .nd-theme-btn__sun { transform: rotate(0) scale(1); opacity: 1; }
.nd-theme-btn__icons[data-mode="light"] .nd-theme-btn__moon { transform: rotate(-120deg) scale(.3); opacity: 0; }
.nd-theme-btn__icons[data-mode="dark"] .nd-theme-btn__sun { transform: rotate(120deg) scale(.3); opacity: 0; }
.nd-theme-btn__icons[data-mode="dark"] .nd-theme-btn__moon { transform: rotate(0) scale(1); opacity: 1; }
.nd-theme-btn--labelled { width: 100%; justify-content: flex-start; padding: 0 1rem; border-radius: var(--nd-radius); height: 50px; font-weight: 700; }
.nd-header__tools { display: flex; align-items: center; gap: .6rem; }

.nd-drawer { position: fixed; inset: var(--nd-header-h) 0 0 0; z-index: 99; background: var(--nd-header-bg); padding: var(--nd-4) var(--nd-gutter) var(--nd-7); overflow-y: auto; overscroll-behavior: contain; color: var(--nd-text); animation: nd-drawer-in .35s var(--nd-ease) both; }
.nd-drawer ul { display: grid; }
.nd-drawer a.nd-drawer__link { padding: 1rem .25rem; font-size: 1.15rem; border-bottom: 1px solid var(--nd-border); border-radius: 0; animation: nd-rise .5s var(--nd-ease) both; }
.nd-drawer li:nth-child(2) a { animation-delay: .04s; } .nd-drawer li:nth-child(3) a { animation-delay: .08s; } .nd-drawer li:nth-child(4) a { animation-delay: .12s; }
.nd-drawer li:nth-child(5) a { animation-delay: .16s; } .nd-drawer li:nth-child(6) a { animation-delay: .2s; } .nd-drawer li:nth-child(7) a { animation-delay: .24s; }
.nd-drawer a.nd-drawer__link[aria-current="page"] { color: var(--nd-accent-text) !important; }
.nd-drawer__tools { display: grid; gap: var(--nd-4); margin-top: var(--nd-5); }
.nd-drawer__label { font-size: .85rem; color: var(--nd-text-soft); font-weight: 700; margin-bottom: var(--nd-2); }
@media (min-width: 1100px) {
  .nd-nav { display: block; margin-right: auto; }
  .nd-header__cta { display: inline-flex; }
  .nd-menu-btn { display: none; }
  .nd-drawer { display: none !important; }
  .nd-brand { margin-right: var(--nd-4); }
}

/* 6. HERO: cinematic animated stage -------------------------------------- */
.nd-hero { position: relative; isolation: isolate; overflow: hidden; background: var(--nd-stage); color: #FFFFFF; padding-block: clamp(3rem, 1rem + 7vw, 6.5rem) clamp(3.5rem, 1rem + 7vw, 7rem); }
.nd-hero__bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(120% 90% at 20% 0%, #14246B 0%, var(--nd-stage) 60%); }
.nd-orb { position: absolute; border-radius: 50%; will-change: transform; pointer-events: none; }
.nd-orb--1 { width: 720px; height: 720px; left: -14%; top: -30%; background: radial-gradient(circle at 50% 50%, rgba(66, 104, 235, .75), rgba(66, 104, 235, 0) 66%); animation: nd-drift-1 24s ease-in-out infinite alternate; }
.nd-orb--2 { width: 600px; height: 600px; right: -12%; bottom: -34%; background: radial-gradient(circle at 50% 50%, rgba(225, 29, 72, .55), rgba(225, 29, 72, 0) 66%); animation: nd-drift-2 28s ease-in-out infinite alternate; }
.nd-orb--3 { width: 460px; height: 460px; right: 22%; top: -20%; background: radial-gradient(circle at 50% 50%, rgba(20, 184, 166, .4), rgba(20, 184, 166, 0) 66%); animation: nd-drift-3 32s ease-in-out infinite alternate; }
.nd-beam { position: absolute; top: -20%; left: 0; width: 34%; height: 140%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .09), transparent); transform: translateX(-140%) rotate(16deg); animation: nd-beam 11s ease-in-out infinite; pointer-events: none; }
.nd-beam--2 { width: 22%; animation-delay: 5.5s; animation-duration: 14s; }
.nd-hero__lines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 5px); -webkit-mask-image: radial-gradient(80% 80% at 50% 40%, #000, transparent); mask-image: radial-gradient(80% 80% at 50% 40%, #000, transparent); }
.nd-hero__grid { display: grid; gap: var(--nd-7); align-items: center; }
.nd-hero .nd-eyebrow { color: #FFD6DC; }
.nd-app .nd-hero h1 { color: #FFFFFF; margin-bottom: var(--nd-4); max-width: 14ch; text-wrap: balance; }
.nd-hero .nd-lead { color: rgba(255, 255, 255, .84); }
.nd-hero .nd-actions { margin-top: var(--nd-5); }
.nd-app .nd-hero__note { margin-top: var(--nd-4); font-size: .85rem; color: rgba(255, 255, 255, .7); text-align: center; }
.nd-hero__copy > * { animation: nd-rise .8s var(--nd-ease) both; }
.nd-hero__copy > :nth-child(2) { animation-delay: .08s; } .nd-hero__copy > :nth-child(3) { animation-delay: .16s; } .nd-hero__copy > :nth-child(4) { animation-delay: .24s; }

.nd-scene { position: relative; width: 100%; max-width: 480px; margin-inline: auto; padding: 8% 6% 12%; animation: nd-rise 1s .25s var(--nd-ease) both; }
.nd-scene__glow { position: absolute; inset: 10% 4% 6%; border-radius: 40px; background: radial-gradient(60% 60% at 50% 50%, rgba(80, 120, 255, .45), transparent 70%); animation: nd-glow 6s ease-in-out infinite alternate; }
.nd-tv { position: relative; border-radius: 24px; padding: 10px; background: linear-gradient(145deg, #3555C4, #121C4E); box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .16); animation: nd-bob 8s ease-in-out infinite; }
.nd-tv__screen { position: relative; aspect-ratio: 16 / 10; border-radius: 15px; overflow: hidden; background: radial-gradient(90% 90% at 50% 30%, #2B4AB8, #0F1745 75%); }
.nd-tv__dots { position: absolute; left: 12px; top: 10px; display: flex; gap: 5px; }
.nd-tv__dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .5); }
.nd-tv__play { position: absolute; left: 50%; top: 42%; width: 64px; height: 64px; transform: translate(-50%, -50%); }
.nd-tv__play svg { position: relative; display: block; }
.nd-tv__ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); animation: nd-ring 3s ease-out infinite; }
.nd-tv__ring--2 { animation-delay: 1.5s; }
.nd-tv__rows { position: absolute; left: 12px; right: 12px; bottom: 26px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nd-tv__rows span { aspect-ratio: 4 / 3; border-radius: 7px; background: linear-gradient(135deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .06)); position: relative; overflow: hidden; }
.nd-tv__rows span::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%); transform: translateX(-120%); animation: nd-shimmer 4.5s ease-in-out infinite; }

/* 7. CHANNEL TICKER ------------------------------------------------------- */

.nd-ticker:hover .nd-ticker__move, .nd-ticker:focus-within .nd-ticker__move, .nd-ticker.is-paused .nd-ticker__move { animation-play-state: paused; }
.nd-ticker__row { display: flex; flex: none; gap: .75rem; padding: 1rem .375rem; }

/* 8. SECTIONS AND CARDS ---------------------------------------------------- */
.nd-points { display: grid; gap: var(--nd-4); counter-reset: pt; }

.nd-split { display: grid; gap: var(--nd-6); }

.nd-cards { display: grid; gap: var(--nd-4); }
.nd-card { padding: var(--nd-5); background: var(--nd-surface); border: 1px solid var(--nd-border); border-radius: var(--nd-radius-lg); box-shadow: var(--nd-shadow); transition: transform .35s var(--nd-ease), box-shadow .35s, border-color .3s; }

.nd-chips li:hover { transform: translateY(-2px); border-color: var(--nd-primary); }
.nd-callout { padding: var(--nd-4) var(--nd-5); border-left: 4px solid var(--nd-teal); background: var(--nd-muted); border-radius: 0 var(--nd-radius) var(--nd-radius) 0; }
.nd-app .nd-note { margin-top: var(--nd-5); font-size: var(--nd-text-sm); color: var(--nd-text-soft); max-width: 44rem; }

/* 9. PRICING TIERS --------------------------------------------------------- */

.nd-plan--basic::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: linear-gradient(90deg, var(--nd-teal), var(--nd-primary)); z-index: -1; }

.nd-plan--standard::before { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; bottom: -110px; background: radial-gradient(circle, rgba(225, 29, 72, .55), transparent 65%); z-index: -1; }
.nd-plan--standard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .12) 50%, transparent 65%); transform: translateX(-130%); animation: nd-sweep 7s ease-in-out infinite; z-index: -1; }

.nd-app .nd-plan--standard h3, .nd-app .nd-plan--premium h3, .nd-plan--standard .nd-plan__amt { color: #FFFFFF; }
.nd-plan--standard .nd-plan__cur, .nd-plan--premium .nd-plan__cur, .nd-plan--standard .nd-plan__meta, .nd-plan--premium .nd-plan__meta { color: rgba(255, 255, 255, .82); }

/* 10. STEPS AND FAQ -------------------------------------------------------- */

}

.nd-cta { position: relative; isolation: isolate; overflow: hidden; background: var(--nd-stage); color: #FFFFFF; text-align: center; }

.nd-ask { padding: var(--nd-5); border: 1px solid var(--nd-border); border-radius: var(--nd-radius-lg); background: linear-gradient(160deg, var(--nd-surface), var(--nd-muted)); align-self: start; }

/* 12. INNER PAGES --------------------------------------------------------------- */

.nd-article .callout { padding: var(--nd-4) var(--nd-5); border-left: 4px solid var(--nd-teal); background: var(--nd-muted); border-radius: 0 var(--nd-radius) var(--nd-radius) 0; }
.nd-accordion { display: grid; grid-template-columns: minmax(0, 1fr); gap: .7rem; max-width: 54rem; }

.nd-accordion > details[open] { border-color: var(--nd-primary); box-shadow: var(--nd-shadow); }

.nd-accordion > details > summary > svg { flex: none; color: var(--nd-accent-text); transition: transform .35s var(--nd-ease); }
.nd-accordion > details[open] > summary > svg { transform: rotate(135deg); }
.nd-accordion__body { padding: 0 0 var(--nd-5); display: grid; gap: var(--nd-3); animation: nd-fade-down .4s var(--nd-ease) both; }
.nd-two { display: grid; gap: var(--nd-5); }

.nd-list { display: grid; gap: var(--nd-2); padding-left: 1.2rem !important; list-style: disc !important; color: var(--nd-text); }

.nd-split-2 { display: grid; gap: var(--nd-7); }

.nd-dl { display: grid; gap: var(--nd-4); margin-top: var(--nd-6); }

.nd-form { display: grid; gap: var(--nd-3); padding: var(--nd-5); background: var(--nd-surface); border: 1px solid var(--nd-border); border-radius: var(--nd-radius-lg); box-shadow: var(--nd-shadow); }
